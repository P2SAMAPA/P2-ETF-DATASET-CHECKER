name: Check HF Datasets Status
on:
  workflow_dispatch:
    inputs:
      dataset_filter:
        description: 'Specific dataset to check (leave empty for all 13 datasets)'
        required: false
        default: ''
      check_freshness:
        description: 'Check data freshness (last date in dataset)'
        type: boolean
        default: true
jobs:
  check-datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run dataset validation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATASET_FILTER: ${{ github.event.inputs.dataset_filter }}
          CHECK_FRESHNESS: ${{ github.event.inputs.check_freshness }}
        run: python check_datasets.py
      
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset-check-results-${{ github.run_number }}
          path: data/
          retention-days: 90
      
      - name: Commit results to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update dataset check results [Run ${{ github.run_number }}] - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
